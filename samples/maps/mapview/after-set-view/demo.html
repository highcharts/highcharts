<script src="https://code.highcharts.com/maps/highmaps.js"></script>
<script src="https://code.highcharts.com/maps/modules/accessibility.js"></script>

<div id="container"></div>
<p class="highcharts-description">
    Play to fly to Paris. Pause holds the current view. The demo uses
    <code>afterSetView</code> to stop the flight when you pan or zoom.
    Reset returns to the starting view.
</p>
<div class="camera-controls">
    <button id="play" type="button" disabled>Play</button>
    <button id="reset" type="button" disabled>Reset</button>
    <p id="status" role="status">Loading map…</p>
</div>
