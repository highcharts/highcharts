<script src="https://code.highcharts.com/highcharts.js"></script>
<script src="https://code.highcharts.com/modules/accessibility.js"></script>
<script src="https://code.highcharts.com/themes/adaptive.js"></script>
<script src="https://code.highcharts.com/connectors/morningstar/connectors-morningstar.js"></script>

<div class="tab-container">
    <span>Select time</span>
    <div class="tabs">
        <button class="tab" data-period="M1">1mo</button>
        <button class="tab" data-period="M2">2mos</button>
        <button class="tab" data-period="M3">3mos</button>
        <button class="tab active" data-period="M6">6mos</button>
        <button class="tab" data-period="M12">12mos</button>
        <button class="tab" data-period="M36">36mos</button>
        <button class="tab" data-period="M60">60mos</button>
    </div>
</div>
<div id="charts-container"></div>
<p class="highcharts-description">
    Scatter chart comparing fund, index, and category risk/return across a selected time period.
</p>
