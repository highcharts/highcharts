
<script src="https://code.highcharts.com/stock/highstock.js"></script>
<script src="https://code.highcharts.com/stock/indicators/indicators.js"></script>
<script src="https://code.highcharts.com/modules/accessibility.js"></script>

<div id="container"></div>
<div id="controls">
    <fieldset>
        <legend>Light 1</legend>
        <label>Blur <input type="range" data-shadow="0" data-attr="stdDeviation" min="0" max="20" step="0.5" value="1"> <output>1</output></label>
        <label>Opacity <input type="range" data-shadow="0" data-attr="flood-opacity" min="0" max="1" step="0.05" value="1"> <output>1</output></label>
    </fieldset>
    <fieldset>
        <legend>Light 2</legend>
        <label>Blur <input type="range" data-shadow="1" data-attr="stdDeviation" min="0" max="20" step="0.5" value="2"> <output>2</output></label>
        <label>Opacity <input type="range" data-shadow="1" data-attr="flood-opacity" min="0" max="1" step="0.05" value="1"> <output>1</output></label>
    </fieldset>
    <fieldset>
        <legend>Ambient 1</legend>
        <label>Blur <input type="range" data-shadow="2" data-attr="stdDeviation" min="0" max="20" step="0.5" value="8"> <output>8</output></label>
        <label>Opacity <input type="range" data-shadow="2" data-attr="flood-opacity" min="0" max="1" step="0.05" value="1"> <output>1</output></label>
    </fieldset>
    <fieldset>
        <legend>Ambient 2</legend>
        <label>Blur <input type="range" data-shadow="3" data-attr="stdDeviation" min="0" max="20" step="0.5" value="4"> <output>4</output></label>
        <label>Opacity <input type="range" data-shadow="3" data-attr="flood-opacity" min="0" max="1" step="0.05" value="1"> <output>1</output></label>
    </fieldset>
</div>
