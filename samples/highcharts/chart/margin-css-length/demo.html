<script src="https://code.highcharts.com/highcharts.js"></script>
<script src="https://code.highcharts.com/modules/accessibility.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@highcharts/controls@0.8.0" type="module"></script>

<figure class="highcharts-figure">
  <div id="container"></div>
</figure>

<div class="highcharts-controls-wrapper">
  <highcharts-controls>
    <highcharts-group header="Update options">
      <highcharts-control type="text" path="chart.marginTop" value="5rem"></highcharts-control>
      <highcharts-control type="text" path="chart.marginRight" value="3rem"></highcharts-control>
      <highcharts-control type="text" path="chart.marginBottom" value="4rem"></highcharts-control>
      <highcharts-control type="text" path="chart.marginLeft" value="6rem"></highcharts-control>
    </highcharts-group>
  </highcharts-controls>
</div>
