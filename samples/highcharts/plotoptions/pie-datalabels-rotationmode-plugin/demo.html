<script src="https://code.highcharts.com/highcharts.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@highcharts/controls@0.7.0" type="module"></script>

<div id="container"></div>

<div class="highcharts-controls-wrapper">
  <highcharts-controls>
    <highcharts-group header="Update options">
      <highcharts-control type="number" path="series[0].startAngle" value="0"
        min="-90" max="89"></highcharts-control>
      <highcharts-control type="select" path="series[0].dataLabels.rotationMode"
        value="perpendicular" options="perpendicular,perpendicular-fixed"
      ></highcharts-control>
    </highcharts-group>
  </highcharts-controls>
</div>
