<script src="https://code.highcharts.com/highcharts.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@highcharts/controls@0.8.0" type="module"></script>


<div id="container"></div>



<div class="highcharts-controls-wrapper">
  <highcharts-controls>
    <highcharts-group header="Update options">
      <highcharts-control path="tooltip.outside" type="boolean" value="false"></highcharts-control>
      <highcharts-control path="xAxis[0].opposite" type="boolean" value="false"></highcharts-control>
    </highcharts-group>
  </highcharts-controls>
</div>
