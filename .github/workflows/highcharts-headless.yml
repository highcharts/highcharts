name: Highcharts headless tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test_unit_tests:
    name: Node unit tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Highcharts
        run: npx gulp scripts

      - name: Verify webpack bundles
        run: |
          node tools/webpacks/check-duplicates.mjs
          node tools/webpacks/check-namespace-exposure.mjs

      - name: Run unit tests
        run: npm run test-node

  test_playwright:
    name: Playwright tests
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      DISPLAY: :99
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Setup Display
        run: sudo Xvfb -ac :99 -screen 0 1280x1024x24 > /dev/null 2>&1 &

      - name: Build Highcharts
        run: npx gulp scripts

      - name: Run Highcharts Playwright tests
        run: npx playwright test --project=highcharts

      - name: Run QUnit Playwright tests
        run: npx playwright test --project=qunit
