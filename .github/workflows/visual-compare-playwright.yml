name: Highcharts Playwright Visual Comparison

on:
  workflow_dispatch:
  pull_request:
    branches:
      - 'master'
    paths:
      - 'samples/**'
      - 'ts/**'
      - 'css/**'
      - 'test/karma-files.json'
      - 'test/visual-comparator.js'
      - 'test/visual-test-samples.js'
      - 'tests/fixtures.ts'
      - 'tests/globals.d.ts'
      - 'tests/qunit/utils/browser-log-note-reporter.ts'
      - 'tests/setup-highcharts.mts'
      - 'tests/tsconfig.json'
      - 'tests/utils.ts'
      - 'tests/visual/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/package.json'
      - 'tests/package-lock.json'
      - 'tools/docs-preview/package.json'
      - 'tools/gulptasks/update-pr-testresults.js'
      - 'tools/gulptasks/lib/visualReviewApi.js'
      - 'tools/libs/git.js'
      - 'tools/gulptasks-tests/git.test.mjs'
      - 'tools/gulptasks-tests/update-pr-testresults.test.mjs'
      - 'tools/gulptasks-tests/visualReviewApi.test.mjs'
      - '.github/scripts/commentOnPR.js'
      - 'playwright.config.ts'
      - '.github/workflows/visual-compare-playwright.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  visual_playwright_compare:
    name: Playwright visual comparison
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve revisions
        id: revisions
        run: |
          {
            echo "candidate_sha=$(git rev-parse HEAD)"
            echo "reference_sha=$(git rev-parse origin/master)"
          } >> "$GITHUB_OUTPUT"

      - name: Preserve candidate visual harness
        run: |
          tar -czf "$RUNNER_TEMP/visual-harness.tar.gz" \
            package.json \
            package-lock.json \
            playwright.config.ts \
            test/karma-files.json \
            test/visual-comparator.js \
            test/visual-test-samples.js \
            tests/fixtures.ts \
            tests/globals.d.ts \
            tests/qunit/utils/browser-log-note-reporter.ts \
            tests/setup-highcharts.mts \
            tests/package.json \
            tests/package-lock.json \
            tests/tsconfig.json \
            tests/utils.ts \
            tools/docs-preview/package.json \
            tests/visual

      - name: Checkout pinned master reference
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.revisions.outputs.reference_sha }}
          clean: true
          fetch-depth: 0

      - name: Restore candidate visual harness
        run: tar -xzf "$RUNNER_TEMP/visual-harness.tar.gz" -C "$GITHUB_WORKSPACE"

      - name: Use Node.js lts/*
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            tests/package-lock.json

      - name: Install candidate toolchain for reference
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Restore reference package metadata
        env:
          REFERENCE_SHA: ${{ steps.revisions.outputs.reference_sha }}
        run: |
          git restore --source "$REFERENCE_SHA" -- \
            package.json \
            package-lock.json \
            tests/package.json \
            tests/package-lock.json \
            tools/docs-preview/package.json

      - name: Select comparable visual samples
        run: |
          node --import tsx <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { selectVisualSamples } = require('./tests/visual/visual-samples.ts');
          const requested = new Set(require('./tests/visual/samples.json'));
          const comparable = selectVisualSamples(process.cwd())
            .map(sample => sample.id)
            .filter(id => requested.has(id));
          if (!comparable.length) throw new Error('No comparable visual samples');
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'visual-samples.json'),
            JSON.stringify(comparable));
          console.log(`Comparing ${comparable.length} of ${requested.size} candidate samples present and eligible in both revisions.`);
          NODE

      - name: Generate master reference
        id: reference
        continue-on-error: true
        env:
          VISUAL_TEST_MANIFEST: ${{ runner.temp }}/visual-samples.json
          VISUAL_TEST_REFERENCE: '1'
        run: npx playwright test tests/visual/visual.spec.ts --project=visual

      - name: Preserve reference visual evidence
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/visual-reference"
          mkdir -p "$RUNNER_TEMP/visual-reference"

          find samples -type f -name reference.svg -print0 |
          while IFS= read -r -d '' file; do
            target="$RUNNER_TEMP/visual-reference/$file"
            mkdir -p "$(dirname "$target")"
            cp "$file" "$target"
          done

          for file in \
            test/visual-test-results.json \
            test/visual-test-errors.log; do
            if [ -f "$file" ]; then
              target="$RUNNER_TEMP/visual-reference/$file"
              mkdir -p "$(dirname "$target")"
              cp "$file" "$target"
            fi
          done

          for directory in playwright-report test-results; do
            if [ -d "$directory" ]; then
              mkdir -p "$RUNNER_TEMP/visual-reference/$directory"
              cp -R "$directory/." "$RUNNER_TEMP/visual-reference/$directory"
            fi
          done

      - name: Checkout candidate revision
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.revisions.outputs.candidate_sha }}
          clean: true
          fetch-depth: 0

      - name: Restore reference renderings
        run: |
          if [ -d "$RUNNER_TEMP/visual-reference/samples" ]; then
            mkdir -p samples
            cp -R "$RUNNER_TEMP/visual-reference/samples/." samples
          fi

      - name: Install candidate toolchain
        run: npm ci

      - name: Run candidate visual comparison
        id: candidate
        continue-on-error: true
        env:
          VISUAL_TEST_MANIFEST: ${{ runner.temp }}/visual-samples.json
        run: npx playwright test --project=visual

      - name: Verify visual run outcomes
        if: always()
        env:
          REFERENCE_OUTCOME: ${{ steps.reference.outcome }}
          CANDIDATE_OUTCOME: ${{ steps.candidate.outcome }}
        run: |
          failures=0

          if [ "$REFERENCE_OUTCOME" != "success" ]; then
            echo "::error::Reference step outcome: $REFERENCE_OUTCOME"
            failures=1
          fi
          if [ "$CANDIDATE_OUTCOME" != "success" ]; then
            echo "::error::Candidate step outcome: $CANDIDATE_OUTCOME"
            failures=1
          fi
          if [ ! -f test/visual-test-complete ]; then
            echo "::error::Candidate visual test completion marker is missing."
            failures=1
          fi
          if [ -s test/visual-test-errors.log ]; then
            echo "::error::Visual test execution errors were recorded."
            failures=1
          fi

          exit "$failures"

      - name: Publish Playwright visual results
        id: publish
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          VISUAL_REVIEW_API_KEY: ${{ secrets.VISUAL_REVIEW_INGESTION_API_KEY }}
          VISUAL_REVIEW_PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx gulp update-pr-testresults --pr "$PR_NUMBER"

      - name: Comment on PR
        if: ${{ success() && steps.publish.outcome == 'success' }}
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.PR_COMMENT_TOKEN }}
          script: |
            const { createOrUpdateComment } = require('./.github/scripts/commentOnPR');
            const { readFileSync } = require('node:fs');
            const { title, body } = JSON.parse(readFileSync(
              'tmp/pr-visual-test-comment.json', 'utf8'
            ));
            const results = JSON.parse(readFileSync('test/visual-test-results.json', 'utf8'));
            await createOrUpdateComment(
              github,
              context,
              title.replace('Visual test results', 'Playwright visual test results'),
              `\nCovers **${Object.keys(results).length} samples** from the Playwright manifest. ` +
                `Playwright publishes the production visual review.\n\n${body}`
            );

      - name: Upload Playwright visual evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-visual-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/visual-samples.json
            ${{ runner.temp }}/visual-reference
            samples/**/reference.svg
            samples/**/candidate.svg
            samples/**/diff.gif
            test/visual-test-results.json
            test/visual-test-errors.log
            test/visual-test-complete
            tmp/pr-visual-test-comment.json
            playwright-report
            test-results
