name: Highcharts Playwright Visual Comparison

on:
  workflow_dispatch:
  pull_request:
    branches:
      - 'master'
    paths:
      - 'samples/**'
      - 'ts/**'
      - 'css/**'
      - 'tests/visual/**'
      - 'tests/fixtures.ts'
      - 'tests/utils.ts'
      - 'playwright.config.ts'
      - '.github/workflows/visual-compare-playwright.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  visual_playwright_compare:
    name: Playwright visual comparison
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Save candidate revision
        id: candidate_revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Preserve candidate visual harness
        run: |
          tar -czf "$RUNNER_TEMP/visual-harness.tar.gz" \
            test/visual-comparator.js \
            tests/visual/visual.spec.ts \
            tests/visual/visual-setup.js \
            tests/visual/visual-results.ts

      - name: Checkout master
        uses: actions/checkout@v6
        with:
          ref: master
          clean: true
          fetch-depth: 0

      - name: Restore candidate visual harness
        run: tar -xzf "$RUNNER_TEMP/visual-harness.tar.gz" -C "$GITHUB_WORKSPACE"

      - name: Use Node.js lts/*
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            tests/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate master reference
        id: reference
        continue-on-error: true
        run: VISUAL_TEST_PATH=samples/highcharts/demo/area-missing VISUAL_TEST_REFERENCE=1 npx playwright test tests/visual/visual.spec.ts --project=visual

      - name: Checkout candidate revision
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.candidate_revision.outputs.sha }}
          clean: false
          fetch-depth: 0

      - name: Remove stale candidate evidence
        run: |
          rm -f \
            test/visual-test-results.json \
            test/visual-test-errors.log \
            test/visual-test-complete \
            samples/highcharts/demo/area-missing/candidate.svg \
            samples/highcharts/demo/area-missing/diff.gif

      - name: Run candidate visual comparison
        id: candidate
        continue-on-error: true
        run: VISUAL_TEST_PATH=samples/highcharts/demo/area-missing npx playwright test tests/visual/visual.spec.ts --project=visual

      - name: Upload Playwright visual evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-visual-area-missing-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            samples/highcharts/demo/area-missing/reference.svg
            samples/highcharts/demo/area-missing/candidate.svg
            samples/highcharts/demo/area-missing/diff.gif
            test/visual-test-results.json
            test/visual-test-errors.log
            test/visual-test-complete
            playwright-report
            test-results

      - name: Summarize Playwright visual diagnostic
        if: always()
        env:
          REFERENCE_OUTCOME: ${{ steps.reference.outcome }}
          CANDIDATE_OUTCOME: ${{ steps.candidate.outcome }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const resultsPath = 'test/visual-test-results.json';
          const errorPath = 'test/visual-test-errors.log';
          const completionPath = 'test/visual-test-complete';
          let difference = 'unavailable';

          if (fs.existsSync(resultsPath)) {
              try {
                  const results = JSON.parse(fs.readFileSync(resultsPath, 'utf8'));
                  const value = results['highcharts/demo/area-missing'];
                  difference = Number.isInteger(value) && value >= 0 ?
                      String(value) : 'unavailable';
              } catch (error) {
                  difference = `invalid JSON: ${error.message}`;
              }
          }

          const errorPresent = fs.existsSync(errorPath) &&
              fs.statSync(errorPath).size > 0;
          const completionPresent = fs.existsSync(completionPath) &&
              fs.statSync(completionPath).isFile();
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
              '### Playwright visual diagnostic',
              '',
              '| Check | Result |',
              '| --- | --- |',
              `| Reference outcome | ${process.env.REFERENCE_OUTCOME} |`,
              `| Candidate outcome | ${process.env.CANDIDATE_OUTCOME} |`,
              `| Completion marker | ${completionPresent ? 'present' : 'absent'} |`,
              `| Error log | ${errorPresent ? 'non-empty' : 'empty or absent'} |`,
              `| Pixel difference | ${difference} |`,
              ''
          ].join('\n'));
          NODE

      - name: Fail on execution or completion errors
        if: always()
        env:
          REFERENCE_OUTCOME: ${{ steps.reference.outcome }}
          CANDIDATE_OUTCOME: ${{ steps.candidate.outcome }}
        run: |
          failures=0

          if [ "$REFERENCE_OUTCOME" != "success" ]; then
            echo "::error::Reference step outcome: $REFERENCE_OUTCOME"
            failures=1
          fi
          if [ "$CANDIDATE_OUTCOME" != "success" ]; then
            echo "::error::Candidate step outcome: $CANDIDATE_OUTCOME"
            failures=1
          fi
          if [ -s test/visual-test-errors.log ]; then
            echo "::error::Visual test execution errors were recorded."
            failures=1
          fi
          if [ ! -f test/visual-test-complete ]; then
            echo "::error::Candidate visual test completion marker is missing."
            failures=1
          fi
          if ! node <<'NODE'
          const fs = require('node:fs');

          try {
              const results = JSON.parse(fs.readFileSync(
                  'test/visual-test-results.json',
                  'utf8'
              ));
              const key = 'highcharts/demo/area-missing';
              if (
                  results === null ||
                  typeof results !== 'object' ||
                  Array.isArray(results) ||
                  !Object.prototype.hasOwnProperty.call(results, key) ||
                  !Number.isInteger(results[key]) ||
                  results[key] < 0
              ) {
                  throw new Error('Expected a non-negative integer result.');
              }
          } catch (error) {
              console.error(`::error::Invalid visual test result: ${error.message}`);
              process.exit(1);
          }
          NODE
          then
            failures=1
          fi

          exit "$failures"
