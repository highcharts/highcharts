name: Nightly

on:
  schedule:
    - cron: "0 2 * * *" # 2am
  workflow_dispatch:
    inputs:
      pushToDist:
        description: 'Whether to update highcharts-dist nightly (master runs only)'
        required: false
        default: true
        type: boolean
      validateDistribution:
        description: 'Run the advisory npm package validation'
        required: false
        default: false
        type: boolean

permissions:
   contents: read # to fetch code (actions/checkout)

jobs:
  nightly_unit_tests:
    name: Node unit tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Highcharts
        run: npx gulp scripts

      - name: Run unit tests
        run: npm run test-node

      - name: Run tooling unit tests
        run: npm run test-node:tooling

  nightly_cypress:
    name: Cypress tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: highcharts

      - uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: highcharts/package-lock.json

      - name: Install Highcharts deps
        run: |
          cd highcharts
          npm ci

      - name: Build Highcharts
        run: |
          cd highcharts
          npx gulp scripts

      - name: Checkout utils
        uses: actions/checkout@v6
        with:
          repository: highcharts/highcharts-utils
          path: utils
          fetch-depth: 1

      - name: Install Highcharts Utils
        run: |
          cd utils
          npm ci

      - name: Run Cypress test
        uses: cypress-io/github-action@v7
        with:
          start: node ../utils/server --localOnly
          wait-on: 'http://localhost:3031/highcharts.js'
          browser: chrome
          working-directory: highcharts
          config-file: test/cypress/highcharts/config.mjs
          install: false

  notify_if_error:
    runs-on: ubuntu-latest
    needs: ['nightly_unit_tests', 'nightly_cypress', 'nightly_playwright_all_browsers']
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    env:
      JSON_NEEDS: ${{ toJSON(needs) }}
    steps:
      - name: Checkout repository scripts
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github/scripts

      - name: Create list of failed jobs
        uses: actions/github-script@v8
        with:
          script: |
            const { writeFileSync } = require('fs');
            const needsJSON = JSON.parse(process.env.JSON_NEEDS);

            const list = Object.keys(needsJSON).filter(key => {
              const value = needsJSON[key];
              return typeof value === 'object' && value.result === 'failure';
            }).map(key => `* ${key}`);

            console.log(list);

            const listBody = JSON.stringify({
              date: (new Date()).toLocaleDateString('no-NO'),
              body: 'Errors occured in the following job(s):\n'+
                list.join('\n') +
                '\n\n'+
                'See the run on github (https://github.com/highcharts/highcharts/actions/runs/${{ github.run_id }}) for more information'
            });

            writeFileSync(
              'info.json',
              listBody
            );

      - name: Call Slack webhook
        id: slack
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
        with:
          payload-file-path: "info.json"
          webhook: ${{ secrets.SLACK_NIGHTLY_ERROR_WEBHOOK }}
          webhook-type: webhook-trigger

  nightly_playwright_all_browsers:
    name: Playwright tests (all browsers)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      DISPLAY: :99
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Setup Display
        run: sudo Xvfb -ac :99 -screen 0 1280x1024x24 > /dev/null 2>&1 &

      - name: Build Highcharts
        run: npx gulp scripts

      - name: Run Highcharts Playwright tests (Chromium)
        id: test_highcharts
        run: PLAYWRIGHT_HTML_REPORT=playwright-report/highcharts npx playwright test --project=setup-highcharts --project=highcharts
        continue-on-error: true

      - name: Run Highcharts Playwright tests (Firefox)
        id: test_highcharts_firefox
        run: PLAYWRIGHT_HTML_REPORT=playwright-report/highcharts-firefox npx playwright test --project=setup-highcharts --project=highcharts-firefox
        continue-on-error: true

      - name: Run Highcharts Playwright tests (WebKit)
        id: test_highcharts_webkit
        run: PLAYWRIGHT_HTML_REPORT=playwright-report/highcharts-webkit npx playwright test --project=setup-highcharts --project=highcharts-webkit
        continue-on-error: true

      - name: Run QUnit Playwright tests (Chromium)
        id: test_qunit
        run: PLAYWRIGHT_HTML_REPORT=playwright-report/qunit npx playwright test --project=qunit
        continue-on-error: true

      - name: Run QUnit Playwright tests (Firefox)
        id: test_qunit_firefox
        run: PLAYWRIGHT_HTML_REPORT=playwright-report/qunit-firefox npx playwright test --project=qunit-firefox
        continue-on-error: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

      - name: Fail workflow when tests fail
        if: always()
        run: |
          failures=""
          check_step() {
            if [ "$1" = "failure" ]; then
              if [ -n "$failures" ]; then
                failures="$failures, $2"
              else
                failures="$2"
              fi
            fi
          }

          check_step "${{ steps.test_highcharts.outcome }}" "highcharts"
          check_step "${{ steps.test_highcharts_firefox.outcome }}" "highcharts-firefox"
          check_step "${{ steps.test_highcharts_webkit.outcome }}" "highcharts-webkit"
          check_step "${{ steps.test_qunit.outcome }}" "qunit"
          check_step "${{ steps.test_qunit_firefox.outcome }}" "qunit-firefox"

          if [ -n "$failures" ]; then
            echo "::error::Playwright projects failed: $failures"
            exit 1
          fi

  nightly_visual_diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Set application version env var
        run: |
          HIGHCHARTS_VERSION="$(node -p "require('./package.json').version")"
          echo "HIGHCHARTS_VERSION=${HIGHCHARTS_VERSION}" >> "$GITHUB_ENV"
          echo "${HIGHCHARTS_VERSION}"

      - name: Generate nightly references
        env:
          VISUAL_TEST_REFERENCE: '1'
        run: npx playwright test tests/visual/visual.spec.ts --project=visual

      - name: Preserve generated reference images
        run: npx gulp copy-nightly-references

      - name: Sync references from Visual Review API
        env:
          VISUAL_REVIEW_API_KEY: ${{secrets.VISUAL_REVIEW_INGESTION_API_KEY}}
        run: npx gulp sync-nightly-references

      - name: Run nightly visual comparison
        run: npx playwright test tests/visual/visual.spec.ts --project=visual

      - name: Verify nightly visual completion
        run: |
          if [ ! -f test/visual-test-complete ]; then
            echo "::error::Candidate visual test completion marker is missing."
            exit 1
          fi
          if [ -s test/visual-test-errors.log ]; then
            echo "::error::Visual test execution errors were recorded."
            exit 1
          fi

      - name: Publish nightly visual results
        env:
          VISUAL_REVIEW_API_KEY: ${{secrets.VISUAL_REVIEW_INGESTION_API_KEY}}
        run: npx gulp update-nightly-testresults --tag "${HIGHCHARTS_VERSION}" --reference-root tmp/nightly-reference-samples


  nightly_dist:
    runs-on: ubuntu-latest
    outputs:
      distribution: ${{ steps.distribution.outputs.artifact-id }}
      build_evidence: ${{ steps.build_evidence.outputs.artifact-id }}
    steps:
      - name: Checkout highcharts
        uses: actions/checkout@v6
        with:
          path: highcharts
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout highcharts-dist
        uses: actions/checkout@v6
        with:
          repository: highcharts/highcharts-dist
          path: highcharts-dist
          ref: 'master'
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: ./highcharts/package-lock.json

      - name: Install and build
        working-directory: ./highcharts
        run: |
          metadata_before=$(git -C ../highcharts-dist rev-parse HEAD)
          npm ci
          npm run build -- --CI true
          npx gulp scripts-es5
          npx gulp dist-verify
          npx gulp dist-release --force-yes
          node tools/nightly-package-validation-prototype/distribution.mjs record \
            ../highcharts-dist "$RUNNER_TEMP/build-manifest.json" "$metadata_before"

      - name: Upload distribution artifact
        id: distribution
        uses: actions/upload-artifact@v6
        with:
          name: nightly-dist-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            highcharts-dist/
            !highcharts-dist/.git
            !highcharts-dist/.git/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Upload build evidence
        id: build_evidence
        uses: actions/upload-artifact@v6
        with:
          name: nightly-package-build-${{ github.run_attempt }}
          path: ${{ runner.temp }}/build-manifest.json
          if-no-files-found: error
          retention-days: 30

  nightly_package_validation:
    name: Validate nightly npm package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: nightly_dist
    if: ${{ inputs.validateDistribution || (github.event_name == 'schedule' && vars.NIGHTLY_PACKAGE_VALIDATION == 'true') }}
    outputs:
      checks: ${{ steps.validate.outputs.verdict }}
      evidence: ${{ steps.evidence.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '26.13.0'
          package-manager-cache: false

      - name: Check artifact references
        env:
          DISTRIBUTION: ${{ needs.nightly_dist.outputs.distribution }}
          BUILD_EVIDENCE: ${{ needs.nightly_dist.outputs.build_evidence }}
        run: test -n "$DISTRIBUTION" && test -n "$BUILD_EVIDENCE"

      - name: Download distribution artifact
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.nightly_dist.outputs.distribution }}
          path: ${{ runner.temp }}/assembled-distribution

      - name: Download build evidence
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.nightly_dist.outputs.build_evidence }}
          path: ${{ runner.temp }}/package-validation

      - name: Verify and pack the distribution
        run: |
          prototype="$GITHUB_WORKSPACE/tools/nightly-package-validation-prototype"
          distribution="$RUNNER_TEMP/assembled-distribution"
          cd "$RUNNER_TEMP/package-validation"
          test "$(npm --version)" = '11.20.0'
          node "$prototype/distribution.mjs" verify "$distribution" build-manifest.json
          npm pack "$distribution" --ignore-scripts --json > pack.json
          node "$prototype/distribution.mjs" verify "$distribution" build-manifest.json
          tarball=$(jq -er '.[0] | select(.name == "highcharts") | .filename' pack.json)
          mv -- "$tarball" candidate.tgz
          sha256sum build-manifest.json candidate.tgz > SHA256SUMS

      - name: Install Chromium
        working-directory: ${{ runner.temp }}/package-validation
        run: npm exec --yes --package=@playwright/test@1.61.1 -- playwright install --with-deps --only-shell chromium

      - name: Run isolated consumer checks
        id: validate
        working-directory: ${{ runner.temp }}/package-validation
        run: |
          digest=$(awk '$2 == "candidate.tgz" { print $1 }' SHA256SUMS)
          TMPDIR="$PWD" node "$GITHUB_WORKSPACE/tools/nightly-package-validation-prototype/run.mjs" candidate.tgz "$digest"

      - name: Upload validation evidence
        id: evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: nightly-package-validation-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/package-validation/
            !${{ runner.temp }}/package-validation/**/node_modules/**
            !${{ runner.temp }}/package-validation/**/npm-cache/**
          if-no-files-found: error
          retention-days: 14

  nightly_package_summary:
    name: Summarize nightly package validation
    runs-on: ubuntu-latest
    needs: [nightly_dist, nightly_package_validation]
    if: ${{ !cancelled() && (inputs.validateDistribution || (github.event_name == 'schedule' && vars.NIGHTLY_PACKAGE_VALIDATION == 'true')) }}
    steps:
      - name: Report advisory result
        env:
          BUILD: ${{ needs.nightly_dist.result }}
          VALIDATION: ${{ needs.nightly_package_validation.result }}
          CHECKS: ${{ needs.nightly_package_validation.outputs.checks }}
          EVIDENCE: ${{ needs.nightly_package_validation.outputs.evidence }}
        run: |
          verdict=blocked
          if [[ "$BUILD" == success && "$VALIDATION" == success && "$CHECKS" == passed && -n "$EVIDENCE" ]]; then
            verdict=passed
          elif [[ "$CHECKS" == failed ]]; then
            verdict=failed
          fi
          {
            printf '## Nightly npm package validation — %s\n\n' "$verdict"
            printf 'Run %s, attempt %s\n\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf -- '- Distribution build and upload: %s\n- Validation job: %s\n' "$BUILD" "$VALIDATION"
            printf -- '- Consumer checks: %s\n' "${CHECKS:-unavailable}"
            if [[ -n "$EVIDENCE" ]]; then
              printf -- '- [Validation evidence](%s/%s/actions/runs/%s/artifacts/%s)\n' \
                "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$EVIDENCE"
            else
              printf -- '- Validation evidence unavailable\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          test "$verdict" = passed

  nightly_dist_publish:
    runs-on: ubuntu-latest
    needs: [nightly_dist, nightly_unit_tests, nightly_cypress, nightly_playwright_all_browsers, nightly_visual_diff]
    if: ${{ github.ref == 'refs/heads/master' && (github.event_name == 'schedule' || inputs.pushToDist) }}
    # Configure master-only access and environment secrets before enabling.
    # See nightly.md for the credential migration.
    environment: nightly-dist
    concurrency:
      group: nightly-dist
      cancel-in-progress: false
    steps:
      - name: Check artifact reference
        env:
          DISTRIBUTION: ${{ needs.nightly_dist.outputs.distribution }}
        run: test -n "$DISTRIBUTION"

      - name: Download distribution artifact
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.nightly_dist.outputs.distribution }}
          path: nightly-dist

      - name: Validate distribution artifact
        run: |
          test -s nightly-dist/highcharts.js
          test -s nightly-dist/package.json
          invalid_files=$(find nightly-dist \( -name .git -o \( ! -type f -a ! -type d \) \) -print -quit)
          if [ -n "${invalid_files}" ]; then
            echo "::error::Distribution artifact contains Git metadata or special files."
            exit 1
          fi

      - name: Checkout highcharts-dist
        uses: actions/checkout@v6
        with:
          repository: highcharts/highcharts-dist
          token: ${{ secrets.NIGHTLY_DIST_TOKEN }}
          path: highcharts-dist
          ref: 'nightly'
          fetch-depth: 0

      - name: Copy distribution files
        run: rsync --archive --checksum --delete --exclude='.git' nightly-dist/ highcharts-dist/

      - name: Upload to github
        working-directory: ./highcharts-dist
        env:
          # Dedicated, passphrase-free SSH private key encoded as base64.
          # Register its public key as a signing key on highsoft-bot.
          SIGNING_KEY: ${{ secrets.DIST_SSH_SIGNING_KEY_BASE64 }}
        run: |
          git add --all

          if git diff --cached --quiet; then
            echo "The nightly distribution is already current."
            exit 0
          fi

          : "${SIGNING_KEY:?Set DIST_SSH_SIGNING_KEY_BASE64 in the nightly-dist environment}"
          signing_key=$(mktemp "${RUNNER_TEMP}/nightly-signing-key.XXXXXX")
          trap 'rm -f "${signing_key}"' EXIT
          printf '%s' "${SIGNING_KEY}" | base64 --decode > "${signing_key}"
          chmod 600 "${signing_key}"
          ssh-keygen -y -P '' -f "${signing_key}" > /dev/null

          git config user.name "CircleCI"
          git config user.email "technical+circleci_mu@highsoft.com"
          git config gpg.format ssh
          git config user.signingkey "${signing_key}"
          git commit -S -m "Nightly build - ${GITHUB_RUN_ID}"
          git push origin HEAD:refs/heads/nightly

  nightly_changelog:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # get the full history

      - run: npm ci

      - name: Build tree.json
        run: |
          npx gulp scripts
          npx gulp jsdoc-options

      - name: Generate nightly changelog
        id: generate_changelog
        run: node changelog/generate --review

      - name: Publish nightly changelog
        env:
          VISUAL_REVIEW_API_KEY: ${{secrets.VISUAL_REVIEW_INGESTION_API_KEY}}
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 3 --connect-timeout 10 --max-time 60 \
            --request PUT \
            --header "Authorization: Bearer ${VISUAL_REVIEW_API_KEY}" \
            --header "Content-Type: text/html; charset=utf-8" \
            --data-binary @changelog/review.html \
            https://vrevs.highsoft.com/api/ingestion/changelog/nightly

      - name: Upload nightly changelog artifact
        if: ${{ always() && steps.generate_changelog.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: nightly-changelog
          path: changelog/review.html
          if-no-files-found: error

      - name: create list of merge commits
        id: makelist
        run: |
          git log --since "24 hours ago" --oneline --grep "^.*Merge pull" > 24hoursofhighcharts.list
          echo "lines=$(cat 24hoursofhighcharts.list | grep -e "Merge" -c)" >> "$GITHUB_OUTPUT"

      - name: Convert to JSON
        if: ${{ steps.makelist.outputs.lines > 0 }}
        run: |
          node ./.github/scripts/createListJSON \
            24hoursofhighcharts.list \
            24hoursofhighcharts.json

      - name: Call Slack webhook
        id: slack
        if: ${{ steps.makelist.outputs.lines > 0 }}
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
        with:
          payload-file-path: "24hoursofhighcharts.json"
          webhook: ${{ secrets.SLACK_NIGHTLY_CHANGES_WEBHOOK }}
          webhook-type: webhook-trigger
